name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum versions declared in README.md and mix.exs.
          - os: ubuntu-latest
            otp: '24.3'
            elixir: '1.14.5'
          # Current primary toolchain on every supported runner.
          - os: ubuntu-latest
            otp: '27'
            elixir: '1.18'
          - os: windows-latest
            otp: '27'
            elixir: '1.18'
          - os: macos-latest
            otp: '27'
            elixir: '1.18'
    
    steps:
      - name: Preserve LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      
      - name: Cache dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-mix-
      
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      
      - name: Install dependencies
        run: mix deps.get
      
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.elixir == '1.18'
        run: mix format --check-formatted
      
      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors
      
      - name: Run tests
        run: mix test
      
      - name: Run Credo
        run: mix credo --strict

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      
      - name: Cache dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      
      - name: Install dependencies
        run: mix deps.get
      
      - name: Run tests with coverage
        run: MIX_ENV=test mix coveralls.json
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
