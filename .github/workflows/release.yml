name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          mix_version="$(sed -n 's/.*@version "\([^"]*\)".*/\1/p' mix.exs)"

          if [ -z "$mix_version" ] || [ "$tag_version" != "$mix_version" ]; then
            echo "Release tag version '$tag_version' does not match mix.exs version '$mix_version'." >&2
            exit 1
          fi
      
      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      
      - name: Cache dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      
      - name: Install dependencies
        run: mix deps.get
      
      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      - name: Run coverage gate
        run: MIX_ENV=test mix coveralls.json

      - name: Run Dialyzer
        run: mix dialyzer

      - name: Run strict OpenSSL compatibility checks
        run: mix run scripts/openssl_compat.exs

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  publish:
    name: Publish to Hex.pm
    needs: release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      
      - name: Cache dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      
      - name: Install dependencies
        run: mix deps.get
      
      - name: Check package
        run: mix hex.build
      
      - name: Publish package
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
